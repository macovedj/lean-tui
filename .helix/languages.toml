# Option 1: Standard Lake serve (recommended)
# Handles dependencies automatically, uses LeanDag RPC when imported
[language-server.lake-serve]
command = "lake"
args = ["serve"]

# Option 2: Proxy mode with TUI integration
# Uses lean-tui as LSP proxy with built-in TCP server for TUI
[language-server.lean-tui]
command = "cargo"
args = ["run", "--quiet", "--", "proxy"]

[[language]]
name = "lean"
language-servers = ["lake-serve"]
