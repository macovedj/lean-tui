[package]
authors = ["Willem Vanhulle <willemvanhulle@protonmail.com>"]
description = "Standalone TUI infoview for Lean 4 theorem prover"
edition = "2021"
keywords = ["lean4", "proof-assistant", "tui", "mathematics"]
license = "MIT"
name = "lean-tui"
repository = "https://codeberg.org/wvhulle/lean-tui"
version = "0.5.0"

[lints.clippy]
absolute_paths = { level = "warn", priority = 2 }
# TUI coordinate calculations involve safe numeric conversions
cast_possible_truncation = { level = "allow", priority = 2 }
cast_possible_wrap = { level = "allow", priority = 2 }
cast_sign_loss = { level = "allow", priority = 2 }
excessive_nesting = { level = "warn", priority = 2 }
# ViewMode variants have different sizes by design
large_enum_variant = { level = "allow", priority = 2 }
missing_errors_doc = { level = "allow", priority = -1 }
# Vec::is_empty/len aren't const on stable Rust
missing_const_for_fn = { level = "allow", priority = 2 }
nursery = "warn"
pedantic = "deny"
# HypothesisFilters uses bools for filter flags by design
struct_excessive_bools = { level = "allow", priority = 2 }

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Paths
dirs = "6"

# TUI
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
ratatui = "0.29"

# Graph data structures
petgraph = "0.7"

[build-dependencies]
prettyplease = "0.2"
serde_json = "1"
syn = "2"
typify = "0.4"
ureq = "2"
