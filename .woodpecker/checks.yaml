when:
  - repo: wvhulle/lean-tui
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
      sandbox = false
  - &on_pull_requests
    - event: pull_request
  - &after_earlier_steps
    - status: [success, failure]

steps:
  - name: build-cargo-dependencies
    image: nixos/nix:2.34.9
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-unless-cached -- .#packages.x86_64-linux.cargo-dependencies

  - name: build-lean-tui
    image: nixos/nix:2.34.9
    depends_on: [build-cargo-dependencies]
    when: *after_earlier_steps
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.build-lean-tui

  - name: cargo-test
    image: nixos/nix:2.34.9
    depends_on: [build-cargo-dependencies]
    when: *after_earlier_steps
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: keybinding-docs
    image: nixos/nix:2.34.9
    depends_on: [build-cargo-dependencies]
    when: *after_earlier_steps
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.keybinding-docs

  - name: upload-check-cache
    image: nixos/nix:2.34.9
    depends_on: [build-lean-tui, cargo-test, keybinding-docs, rustfmt]
    when:
      - event: [push, manual]
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: rustfmt
    image: nixos/nix:2.34.9
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.fmt

  - name: ci-task-tests
    image: nixos/nix:2.34.9
    depends_on: []
    environment: *nix_config
    commands:
      - nix build --quiet --print-build-logs .#checks.x86_64-linux.ci-task-tests

  - name: conventional-commits
    image: nixos/nix:2.34.9
    depends_on: []
    when: *on_pull_requests
    environment: *nix_config
    commands:
      - nix run --quiet .#check-commits -- --fetch-target-branch FETCH_HEAD..HEAD
