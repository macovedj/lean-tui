when:
  - repo: wvhulle/lean-tui
    event: [pull_request, push, manual]

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
      sandbox = false
  - &after_dependency_step
    - status: [success, failure]

steps:
  - name: prepare-build-dependencies
    image: nixos/nix:2.34.9
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#build-unless-cached -- .#packages.x86_64-linux.build-dependencies

  - name: build-lean-tui
    image: nixos/nix:2.34.9
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.build-lean-tui

  - name: run-test-suite
    image: nixos/nix:2.34.9
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix run --quiet .#build-and-export-paths -- .#checks.x86_64-linux.tests

  - name: check-keybinding-docs
    image: nixos/nix:2.34.9
    depends_on: [prepare-build-dependencies]
    when: *after_dependency_step
    environment: *nix_config
    commands:
      - nix run --quiet .#import-exported-paths
      - nix build --quiet --print-build-logs .#checks.x86_64-linux.keybinding-docs

  - name: upload-builds-to-cachix
    image: nixos/nix:2.34.9
    depends_on: [build-lean-tui, run-test-suite]
    when:
      - event: [push, manual]
        branch: main
        status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: run-pre-commit-hooks
    image: nixos/nix:2.34.9
    depends_on: []
    environment: *nix_config
    commands:
      - nix run --quiet .#run-pre-commit-hooks

  - name: check-commit-messages
    image: nixos/nix:2.34.9
    depends_on: []
    when:
      - event: pull_request
    environment: *nix_config
    commands:
      - nix run --quiet .#check-commit-messages -- --fetch-target-branch FETCH_HEAD..HEAD
