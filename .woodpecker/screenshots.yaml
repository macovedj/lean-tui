when:
  - repo: wvhulle/lean-tui
    event: [push, manual]
    branch: main

depends_on:
  - checks

steps:
  - name: record-and-publish
    image: nixos/nix:2.34.9
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - nix run .#cached-build -- .#recordings --max-jobs 1
      - nix shell nixpkgs#nushell nixpkgs#git -c nu .woodpecker/publish-screenshots.nu result
