when:
  - repo: wvhulle/lean-tui
    event: push
    branch: main
    path:
      - src/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - flake.lock
      - nix/package.nix
      - nix/toolchains.nix
      - recordings/**
  - repo: wvhulle/lean-tui
    event: manual
    branch: main

depends_on:
  - checks

steps:
  - name: record-and-publish
    image: nixos/nix:2.34.9
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        sandbox = false
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - nix run .#cached-build -- .#recordings --max-jobs 1
      - nix run .#publish-screenshots -- result
