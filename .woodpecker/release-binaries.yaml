when:
  - repo: wvhulle/lean-tui
    event: release

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
      sandbox = false

steps:
  - name: build-linux-release-archives
    image: nixos/nix:2.34.9
    environment: *nix_config
    commands:
      - nix run --quiet .#build-and-export-paths -- .#dist
      - nix run --quiet .#collect-release-archives -- result dist

  - name: upload-linux-archives-to-cachix
    image: nixos/nix:2.34.9
    when:
      - status: [success, failure]
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run --quiet .#upload-exported-paths

  - name: attach-archives-to-codeberg-release
    image: nixos/nix:2.34.9
    environment:
      <<: *nix_config
      CODEBERG_TOKEN:
        from_secret: bot_token
    commands:
      - nix run --quiet .#upload-release-assets -- dist
