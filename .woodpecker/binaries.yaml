when:
  - repo: wvhulle/lean-tui
    event: release

variables:
  - &nix_config
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
      sandbox = false

steps:
  - name: build-musl-tarballs
    image: nixos/nix:2.34.9
    environment:
      <<: *nix_config
      CACHIX_AUTH_TOKEN:
        from_secret: cachix_auth_token
    commands:
      - nix run .#cached-build -- .#dist
      - mkdir -p dist
      - cp result/* dist/

  - name: attach-to-codeberg-release
    image: nixos/nix:2.34.9
    environment:
      <<: *nix_config
      CODEBERG_TOKEN:
        from_secret: codeberg_token
    commands:
      - nix run .#upload-release-assets -- dist
