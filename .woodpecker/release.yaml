when:
  - repo: wvhulle/lean-tui
    event: [push, manual]
    branch: main

depends_on:
  - checks

clone:
  - name: clone-with-history
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false
      tags: true

variables:
  - &release_env
    NIX_CONFIG: |
      experimental-features = nix-command flakes
      accept-flake-config = true
      sandbox = false
    GIT_AUTHOR_NAME: release-plz
    GIT_AUTHOR_EMAIL: willemvanhulle@protonmail.com
    GIT_COMMITTER_NAME: release-plz
    GIT_COMMITTER_EMAIL: willemvanhulle@protonmail.com
    CODEBERG_TOKEN:
      from_secret: codeberg_token
    CARGO_REGISTRY_TOKEN:
      from_secret: cargo_registry_token

steps:
  - name: publish-crate-and-tag
    image: nixos/nix:2.34.9
    environment: *release_env
    commands:
      - nix run --quiet .#release

  - name: update-release-pr
    image: nixos/nix:2.34.9
    environment: *release_env
    commands:
      - nix run --quiet .#release-pr
